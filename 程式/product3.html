<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>商品 3 詳細頁</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: "微軟正黑體", sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
      color: #333;
    }

    .product-detail-container {
      display: flex;
      gap: 50px;
      margin-bottom: 50px;
      max-width: 900px;
      width: 90%;
    }

    .product-image-large {
      width: 400px;
      height: 400px;
      border-radius: 15px;
      object-fit: cover;
      background-color: #f0f0f0;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
      flex: 1;
    }

    .product-info h2 {
      margin: 0;
      font-size: 28px;
    }

    .product-info p {
      margin: 0;
      font-size: 20px;
    }

    .back-button {
      background-color: rgba(0,0,0,0.1);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      text-decoration: none;
      color: #000;
      display: inline-block;
      margin-bottom: 50px;
    }

    .back-button:hover {
      transform: scale(1.05);
      background-color: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="product-detail-container">
    <img src="img3.png" alt="商品 3" class="product-image-large">
    <div class="product-info">
      <h2>商品 3 名稱</h2>
      <p>價格：300 金幣</p>
      <p>其他商品描述可以放在這裡</p>
    </div>
  </div>

  <a class="back-button" href="index.html">⬅ 返回首頁</a>

</body>
</html>
